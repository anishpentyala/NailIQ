name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors flask-sqlalchemy numpy opencv-python-headless pytest

      - name: Run tests
        run: |
          python -m pytest ml/infer/tests/ backend/tests/ -q
        # Note: torch is intentionally excluded from dependencies because:
        # (1) it's optional for the geometry/validation pipeline
        # (2) it's large (~2GB) and would slow down CI significantly
        # (3) the trained-CNN track gracefully degrades if torch is unavailable
        # (4) endpoint tests and geometry unit tests run without it
        # ML training and evaluation require torch and are run separately by developers locally.

  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
